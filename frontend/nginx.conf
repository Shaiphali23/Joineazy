server {
  listen 80;

  # Proxying /api here keeps the browser on ONE origin in production, exactly as
  # the Vite dev proxy does in development. No CORS, no cookie/origin mismatch.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Single-page app: unknown paths fall through to index.html so client-side
  # routes survive a hard refresh.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
